<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diabaté</title>
<style>
:root{color-scheme:light;--bg:#f3f5fa;--card:#fff;--chip:#e8ecf5;--text:#10162b;--mute:#62708c;--acc:#3b4cca;--on:#fff;--gold:#f5b301;--red:#d83a52;--ok:#12805c;--bd:#10162b14;--sh:0 4px 16px #10162b0d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0b1020;--card:#141b33;--chip:#1d2745;--text:#eef1fb;--mute:#97a3c2;--acc:#7b8cff;--on:#0b1020;--red:#ff6b81;--ok:#3ddba0;--bd:#ffffff17;--sh:none}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0b1020;--card:#141b33;--chip:#1d2745;--text:#eef1fb;--mute:#97a3c2;--acc:#7b8cff;--on:#0b1020;--red:#ff6b81;--ok:#3ddba0;--bd:#ffffff17;--sh:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Roboto,"Segoe UI",Arial,sans-serif}
button,input{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#app{max-width:600px;margin:auto;height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden}
header{display:flex;align-items:center;gap:12px;padding:14px 16px 10px}
#lg{width:46px;height:46px;border-radius:50%;border:2px solid var(--acc);background:var(--acc);color:var(--on);display:grid;place-items:center;font-weight:800;font-size:22px;overflow:hidden;flex-shrink:0}
#lg img{width:100%;height:100%;object-fit:cover}
h1{margin:0;flex:1;font-size:22px;font-weight:800;letter-spacing:-.4px}h1 small{display:block;font-size:12px;font-weight:600;color:var(--mute);letter-spacing:0;margin-top:1px}
.ib{width:42px;height:42px;border-radius:50%;background:var(--card);box-shadow:var(--sh);border:1px solid var(--bd);font-size:18px}
#view{flex:1;overflow:auto;padding:6px 14px 20px}
nav{display:flex;gap:6px;margin:0 14px 12px;padding:6px;background:var(--card);border-radius:20px;box-shadow:var(--sh);border:1px solid var(--bd)}
nav button{flex:1;padding:12px 4px;border-radius:15px;font-weight:700;font-size:14px;color:var(--mute)}
nav button.on{background:var(--acc);color:var(--on)}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;border:1px solid var(--bd);box-shadow:var(--sh)}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--card);border-radius:18px;margin-bottom:10px;border:1px solid var(--bd);box-shadow:var(--sh);cursor:pointer}
.inf{flex:1;min-width:0}.nm{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{color:var(--mute);font-size:13px;margin-top:3px}.r{text-align:right;font-weight:800;white-space:nowrap}
.tag{font-size:11px;font-weight:800;padding:4px 9px;border-radius:10px;background:var(--chip);color:var(--mute);white-space:nowrap}
.tag.ok{background:#12805c22;color:var(--ok)}.tag.w{background:#f5b30133;color:#a47200}.tag.d{background:#d83a5222;color:var(--red)}
.btn{display:block;width:100%;background:var(--acc);color:var(--on);font-weight:800;border-radius:16px;padding:15px;text-align:center;margin-top:10px}
.btn.g{background:var(--chip);color:var(--text)}.btn.d{background:var(--red);color:#fff}
.sb{width:100%;height:48px;border-radius:16px;border:1px solid var(--bd);background:var(--card);padding:0 16px;font-size:16px;margin-bottom:12px}
.pg{padding:0;overflow:hidden}
.ph{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--chip);font-weight:800;font-size:14px}
.ph span{color:var(--mute);font-weight:700}
.ln{display:grid;grid-template-columns:30px 1fr auto;gap:2px 10px;padding:12px 16px;border-top:1px solid var(--bd);cursor:pointer;align-items:center}
.ln .n{color:var(--mute);font-size:13px;font-weight:700;grid-row:span 2}
.ln .d{font-weight:700;font-size:15px}.ln .m{font-weight:800;text-align:right}
.ln .c{color:var(--mute);font-size:12.5px;grid-column:2/4}
.pf{display:flex;justify-content:space-between;padding:14px 16px;border-top:2px solid var(--bd);font-weight:800}
.tot{position:sticky;bottom:0;background:var(--acc);color:var(--on);border-radius:20px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;font-weight:800;margin-top:6px;box-shadow:0 8px 24px #3b4cca55}
.tot small{display:block;font-weight:600;opacity:.85;font-size:12px}.tot b{font-size:21px}
.empty{text-align:center;color:var(--mute);padding:44px 24px;line-height:1.6}.empty b{display:block;color:var(--text);font-size:18px;margin-bottom:6px}
#ov{position:absolute;inset:0;background:#0009;z-index:20;display:none;align-items:flex-end}#ov.show{display:flex}
#sh{width:100%;max-height:90%;overflow:auto;background:var(--card);border-radius:26px 26px 0 0;padding:20px 20px 26px}
#sh h2{margin:0 0 6px;font-size:21px}
label{display:block;font-size:13px;color:var(--mute);font-weight:700;margin:12px 0 5px}
#sh input{width:100%;height:46px;border-radius:13px;border:1px solid var(--bd);background:var(--bg);padding:0 14px;font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sg button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:12px;background:var(--chip);margin-top:6px;font-size:14px;font-weight:600}
#toast{position:absolute;left:50%;top:74px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:20px;font-size:14px;font-weight:600;z-index:50;display:none;max-width:90%;text-align:center}
.big{font-size:26px;font-weight:800}.k{color:var(--mute);font-size:14px;line-height:1.6}
</style></head>
<body>
<div id="app">
<header><div id="lg"></div><h1>Diabaté<small>Stock et bons de livraison</small></h1><button class="ib" id="bTheme" aria-label="Changer de thème">◐</button></header>
<div id="view"></div>
<nav id="nav"></nav>
<div id="ov"><div id="sh"></div></div>
<div id="toast"></div>
</div>

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const F=n=>Math.round(n).toLocaleString('fr-FR')+' CFA';
const PAGE=16;
let D={articles:[],bls:[],seq:1},tab='bons',cur=null,q='';
try{const r=localStorage.getItem('dia:data');if(r)D=JSON.parse(r)}catch(e){}
const save=()=>{try{localStorage.setItem('dia:data',JSON.stringify(D))}catch(e){toast('Sauvegarde impossible sur cet appareil')}};
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',2400)}
$('#lg').innerHTML=LOGO?`<img src="${LOGO}" alt="Logo Diabaté">`:'D';
const TH=['auto','light','dark'],THN=['Thème automatique','Thème clair','Thème sombre'];let ti=0;
try{ti=Math.max(0,TH.indexOf(localStorage.getItem('dia:theme')))}catch(e){}
function setTheme(){const k=TH[ti];k==='auto'?document.documentElement.removeAttribute('data-theme'):document.documentElement.setAttribute('data-theme',k);try{localStorage.setItem('dia:theme',k)}catch(e){}}
setTheme();$('#bTheme').onclick=()=>{ti=(ti+1)%3;setTheme();toast(THN[ti])};
const TABS=[['bons','Bons'],['art','Articles'],['plus','Plus']];
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b){tab=b.dataset.t;cur=null;q='';render()}};
function sheet(h){$('#sh').innerHTML=h;$('#ov').classList.add('show')}
const closeSheet=()=>$('#ov').classList.remove('show');
$('#ov').onclick=e=>{if(e.target.id==='ov')closeSheet()};
window.goBack=()=>{if($('#ov').classList.contains('show')){closeSheet();return true}if(cur){cur=null;render();return true}if(tab!=='bons'){tab='bons';render();return true}return false};
function ask(msg,label,fn){sheet(`<h2>${msg}</h2><button class="btn d" id="yes">${label}</button><button class="btn g" id="no">Annuler</button>`);$('#yes').onclick=()=>{closeSheet();fn()};$('#no').onclick=closeSheet}
// ---- calculs : montant, pages, total page, total reporté, total du bon
const amt=l=>l.q*l.pu;
function paginate(b){const pages=[];let rep=+b.report||0;
  for(let i=0;i<Math.max(b.lines.length,1);i+=PAGE){const ls=b.lines.slice(i,i+PAGE),t=ls.reduce((s,l)=>s+amt(l),0);pages.push({n:pages.length+1,start:i,lines:ls,rep,total:t});rep+=t}
  return{pages,total:rep}}
const fdate=s=>s?new Date(s+'T12:00:00').toLocaleDateString('fr-FR'):'';
function render(){
  $('#nav').innerHTML=TABS.map(([k,n])=>`<button data-t="${k}" class="${tab===k?'on':''}">${n}</button>`).join('');
  const v=$('#view');v.onclick=null;
  if(tab==='bons')cur?vBl(v):vBons(v);else if(tab==='art')vArt(v);else vPlus(v)}
function search(v,fn,ph){v.insertAdjacentHTML('afterbegin',`<input class="sb" id="q" type="search" placeholder="${ph}" value="${esc(q)}" autocomplete="off">`);$('#q').oninput=e=>{q=e.target.value;fn();const x=$('#q');x.focus();x.setSelectionRange(q.length,q.length)}}
// ---- Bons de livraison
function vBons(v){
  const l=D.bls.slice().reverse().filter(b=>(b.num+b.client).toLowerCase().includes(q.toLowerCase()));
  v.innerHTML=(l.length?l.map(b=>`<div class="row" data-b="${b.id}"><div class="inf"><div class="nm">${esc(b.client||'Sans client')}</div><div class="sub">${esc(b.num)} · ${fdate(b.date)}</div></div><div><div class="r">${F(paginate(b).total)}</div><div style="text-align:right;margin-top:5px"><span class="tag ${b.valid?'ok':'w'}">${b.valid?'Validé':'Brouillon'}</span></div></div></div>`).join(''):`<div class="empty"><b>${D.bls.length?'Aucun résultat':'Aucun bon de livraison'}</b>Crée ton premier bon pour commencer.</div>`)+`<button class="btn" id="nb">+ Nouveau bon de livraison</button>`;
  if(D.bls.length)search(v,()=>vBons(v),'Rechercher un bon ou un client');
  $('#nb').onclick=newBl;v.onclick=e=>{const r=e.target.closest('[data-b]');if(r){cur=+r.dataset.b;render()}}}
function newBl(){
  const t=new Date().toISOString().slice(0,10);
  sheet(`<h2>Nouveau bon de livraison</h2><label>Nom du client</label><input id="c1" placeholder="Ex : DIABATE DORI"><div class="two"><div><label>Code client</label><input id="c2" placeholder="CL.0111"></div><div><label>Date</label><input id="c3" type="date" value="${t}"></div></div><label>Total reporté de départ (optionnel)</label><input id="c4" type="number" inputmode="numeric" placeholder="0"><button class="btn" id="ok">Créer le bon</button>`);
  $('#ok').onclick=()=>{const cl=$('#c1').value.trim();if(!cl){toast('Indique le nom du client');return}
    const b={id:Date.now(),num:'BL'+String(D.seq++).padStart(5,'0')+'/'+String(new Date().getFullYear()).slice(2),date:$('#c3').value||t,client:cl,ccode:$('#c2').value.trim(),report:+$('#c4').value||0,lines:[],valid:false};
    D.bls.push(b);save();closeSheet();cur=b.id;render()}}
const bl=()=>D.bls.find(b=>b.id===cur);
function vBl(v){
  const b=bl(),{pages,total}=paginate(b);
  v.innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px"><div><div class="k">Bon de livraison</div><div class="big">${esc(b.num)}</div></div><span class="tag ${b.valid?'ok':'w'}">${b.valid?'Validé':'Brouillon'}</span></div><div class="k" style="margin-top:8px">Client : <b style="color:var(--text)">${esc(b.client)}</b>${b.ccode?' · '+esc(b.ccode):''}<br>Date : ${fdate(b.date)}</div></div>`+
  pages.map(p=>`<div class="card pg"><div class="ph">Page ${p.n}/${pages.length}<span>${p.n>1||p.rep?'Total reporté : '+F(p.rep):''}</span></div>${p.lines.length?p.lines.map((l,i)=>`<div class="ln" data-l="${p.start+i}"><div class="n">${p.start+i+1}</div><div class="d">${esc(l.name)}</div><div class="m">${F(amt(l))}</div><div class="c">${l.code?esc(l.code)+' · ':''}${l.q} × ${F(l.pu)}</div></div>`).join(''):'<div class="ln" style="cursor:default;display:block;color:var(--mute)">Aucune ligne. Ajoute un article ci-dessous.</div>'}<div class="pf"><span>Total page</span><span>${F(p.total)}</span></div></div>`).join('')+
  (b.valid?'':`<button class="btn g" id="al">+ Ajouter une ligne</button>`)+
  `<div class="tot"><div><small>Total bon de livraison</small></div><b>${F(total)}</b></div>`+
  `<button class="btn g" id="sh2">Partager le bon</button>${b.valid?'':'<button class="btn" id="va">Valider le bon (met le stock à jour)</button>'}<button class="btn d" id="de">Supprimer ce bon</button>`;
  if(!b.valid){$('#al').onclick=()=>lineForm(-1);$('#va').onclick=()=>ask('Valider ce bon ?','Valider et mettre à jour le stock',()=>validate(b))}
  $('#sh2').onclick=()=>share(b);$('#de').onclick=()=>ask('Supprimer ce bon ?','Supprimer',()=>{if(b.valid)stock(b,1);D.bls=D.bls.filter(x=>x!==b);cur=null;save();render();toast('Bon supprimé')});
  v.onclick=e=>{const r=e.target.closest('[data-l]');if(r&&!b.valid)lineForm(+r.dataset.l)}}
function stock(b,sign){b.lines.forEach(l=>{const a=D.articles.find(x=>(l.code&&x.code===l.code)||x.name.toLowerCase()===l.name.toLowerCase());if(a)a.qty=Math.max(0,a.qty+sign*(-l.q))})}
function validate(b){if(!b.lines.length){toast('Ajoute au moins une ligne');return}stock(b,1);b.valid=true;save();render();toast('Bon validé, stock mis à jour')}
function lineForm(i){
  const b=bl(),l=i>=0?b.lines[i]:{code:'',name:'',q:1,pu:''};
  sheet(`<h2>${i>=0?'Modifier la ligne':'Ajouter une ligne'}</h2><label>Désignation</label><input id="l2" value="${esc(l.name)}" placeholder="Tape pour chercher un article" autocomplete="off"><div class="sg" id="sg"></div><div class="two"><div><label>Code</label><input id="l1" value="${esc(l.code)}"></div><div><label>Quantité</label><input id="l3" type="number" inputmode="decimal" value="${l.q}"></div></div><label>Prix unitaire HT (CFA)</label><input id="l4" type="number" inputmode="numeric" value="${l.pu}"><button class="btn" id="ok">Enregistrer</button>${i>=0?'<button class="btn d" id="del">Supprimer la ligne</button>':''}`);
  const sug=()=>{const t=$('#l2').value.toLowerCase();const m=t?D.articles.filter(a=>a.name.toLowerCase().includes(t)||a.code.toLowerCase().includes(t)).slice(0,4):[];
    $('#sg').innerHTML=m.map(a=>`<button data-a="${a.id}">${esc(a.name)} · ${F(a.price)} · stock ${a.qty}</button>`).join('')};
  $('#l2').oninput=sug;$('#sg').onclick=e=>{const x=e.target.closest('[data-a]');if(!x)return;const a=D.articles.find(y=>y.id==x.dataset.a);$('#l1').value=a.code;$('#l2').value=a.name;$('#l4').value=a.price;$('#sg').innerHTML=''};
  $('#ok').onclick=()=>{const n=$('#l2').value.trim(),qt=+$('#l3').value,pu=+$('#l4').value;
    if(!n||!(qt>0)||$('#l4').value===''||!(pu>=0)){toast('Renseigne la désignation, la quantité et le prix');return}
    const nl={code:$('#l1').value.trim(),name:n,q:qt,pu};if(i>=0)b.lines[i]=nl;else b.lines.push(nl);save();closeSheet();render()};
  if(i>=0)$('#del').onclick=()=>{b.lines.splice(i,1);save();closeSheet();render()}}
function share(b){const{pages,total}=paginate(b);
  let t=`DIABATÉ – Bon de livraison ${b.num}\nClient : ${b.client}${b.ccode?' ('+b.ccode+')':''}\nDate : ${fdate(b.date)}\n`;
  pages.forEach(p=>{t+=`\n— Page ${p.n}/${pages.length}${p.rep?' · Total reporté : '+F(p.rep):''}\n`;p.lines.forEach((l,i)=>{t+=`${p.start+i+1}. ${l.name} | ${l.q} × ${F(l.pu)} = ${F(amt(l))}\n`});t+=`Total page : ${F(p.total)}\n`});
  t+=`\nTOTAL BON DE LIVRAISON : ${F(total)}`;
  if(window.Android)Android.shareText(t);else if(navigator.share)navigator.share({text:t}).catch(()=>{});else{try{navigator.clipboard.writeText(t);toast('Bon copié')}catch(e){toast('Partage indisponible')}}}
// ---- Articles / stock
const st=a=>a.qty<=0?['Rupture','d']:a.qty<=a.min?['Stock bas','w']:null;
function vArt(v){
  const l=D.articles.filter(a=>(a.name+a.code).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>a.name.localeCompare(b.name,'fr'));
  v.innerHTML=(l.length?l.map(a=>{const s=st(a);return`<div class="row" data-e="${a.id}"><div class="inf"><div class="nm">${esc(a.name)}</div><div class="sub">${a.code?esc(a.code)+' · ':''}${F(a.price)}</div></div><div style="text-align:right"><div class="r">${a.qty}</div>${s?`<span class="tag ${s[1]}">${s[0]}</span>`:'<div class="sub">en stock</div>'}</div></div>`}).join(''):`<div class="empty"><b>${D.articles.length?'Aucun résultat':'Aucun article'}</b>Ajoute tes articles pour suivre ton stock.</div>`)+`<button class="btn" id="aa">+ Ajouter un article</button>`;
  if(D.articles.length)search(v,()=>vArt(v),'Rechercher un article');
  $('#aa').onclick=()=>artForm();v.onclick=e=>{const r=e.target.closest('[data-e]');if(r)artForm(r.dataset.e)}}
function artForm(id){
  const a=D.articles.find(x=>x.id==id)||{code:'',name:'',price:'',qty:'',min:5};
  sheet(`<h2>${id?'Modifier l’article':'Nouvel article'}</h2><div class="two"><div><label>Code</label><input id="a1" value="${esc(a.code)}" placeholder="ART0590"></div><div><label>Seuil d’alerte</label><input id="a5" type="number" inputmode="numeric" value="${a.min}"></div></div><label>Désignation</label><input id="a2" value="${esc(a.name)}" placeholder="Ex : MILO 400G BOITE X12"><div class="two"><div><label>Prix unitaire HT</label><input id="a3" type="number" inputmode="numeric" value="${a.price}"></div><div><label>Quantité en stock</label><input id="a4" type="number" inputmode="decimal" value="${a.qty}"></div></div><button class="btn" id="ok">Enregistrer</button>${id?'<button class="btn d" id="del">Supprimer l’article</button>':''}`);
  $('#ok').onclick=()=>{const n=$('#a2').value.trim();if(!n||$('#a3').value===''||$('#a4').value===''){toast('Renseigne la désignation, le prix et le stock');return}
    const o={code:$('#a1').value.trim(),name:n,price:+$('#a3').value,qty:+$('#a4').value,min:+$('#a5').value||0};
    id?Object.assign(a,o):D.articles.push({id:Date.now(),...o});save();closeSheet();render();toast('Article enregistré')};
  if(id)$('#del').onclick=()=>ask('Supprimer « '+esc(a.name)+' » ?','Supprimer',()=>{D.articles=D.articles.filter(x=>x!==a);save();render()})}
function vPlus(v){
  const low=D.articles.filter(st);
  v.innerHTML=`<div class="card" style="text-align:center">${LOGO?`<img src="${LOGO}" alt="Logo Diabaté" style="width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid var(--acc)">`:''}<div class="big" style="margin-top:10px">Diabaté</div><p class="k">Gestion de stock et bons de livraison : désignation, prix unitaire, quantité, montant, total page et total du bon. Tout fonctionne sans internet et reste sur ce téléphone.</p></div>
  <div class="card"><b>Stock à surveiller</b>${low.length?low.map(a=>`<div class="sub" style="margin-top:8px">${esc(a.name)} : ${a.qty} restant${a.qty>1?'s':''}</div>`).join(''):'<div class="k">Tout est en ordre.</div>'}</div>
  <p class="k">Version 1.0.0</p><button class="btn d" id="wipe">Effacer toutes les données</button>`;
  $('#wipe').onclick=()=>ask('Effacer tous les articles et tous les bons ?','Tout effacer',()=>{D={articles:[],bls:[],seq:1};save();tab='bons';render();toast('Données effacées')})}
render();
</script>
</body></html>
